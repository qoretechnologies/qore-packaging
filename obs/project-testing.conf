# Copyright (C) 2026 Qore Technologies, s.r.o.
# Qore uses CPU ONNX. Fedora publishes the same library capabilities from
# runtime, development, ROCm and Python packages; choose the CPU runtime
# specifically for qore-stdlib's automatically generated ELF requirements.
Prefer: qore-stdlib:onnxruntime

# OBS omits repository file lists; map the interpreter required by SDK scripts.
FileProvides: /usr/bin/qore qore

# Match the libgit2 providers used by the qualified target SDKs.
%if 0%{?rhel} >= 10
Prefer: libgit2_1.9-devel
%else
Prefer: libgit2-devel
%endif
