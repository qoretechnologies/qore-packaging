stages:
  - test

packaging-tools:
  stage: test
  image: python:3.13-bookworm@sha256:227b6570d6ee07061ae6ca2eb04dedfb6d2b34045835f343065b9869e4d427ea
  tags:
    - k8s
    - amd64
  rules:
    - changes:
        - tools/**/*
        - tests/**/*
        - dependencies/*.py
        - .gitlab-ci.yml
  script:
    - python3 -B -W error -m unittest discover -s tests -v

# Explicitly requested qualification only; ordinary packaging commits never
# start these native installed-package jobs.
.rpm-native-installed:
  stage: test
  tags: [k8s, arm64]
  rules:
    - if: '$RPM_NATIVE_QUALIFICATION == "core21"'
  script:
    - python3 -B -W error tools/qualify-installed.py "$RPM_MANIFEST" --output results/native-installed
  artifacts:
    when: always
    paths: [results/native-installed/]
    expire_in: 14 days

rpm-fedora-arm64:
  extends: .rpm-native-installed
  rules:
    - if: '$RPM_NATIVE_QUALIFICATION == "core21" && ($RPM_NATIVE_TARGET == null || $RPM_NATIVE_TARGET == "fedora")'
  image: registry.fedoraproject.org/fedora@sha256:bd539c7c03d6ee316e0f9396d4a44e6a137d2c4cd6bf6a019f608cfa2fba6fa6
  variables:
    RPM_MANIFEST: qualification/core21-fedora-aarch64.json
  before_script:
    - dnf -y --setopt=install_weak_deps=False install python3 ca-certificates shadow-utils util-linux findutils

rpm-leap-arm64:
  extends: .rpm-native-installed
  rules:
    - if: '$RPM_NATIVE_QUALIFICATION == "core21" && ($RPM_NATIVE_TARGET == null || $RPM_NATIVE_TARGET == "leap")'
  image: opensuse/leap@sha256:e8997b5b4278bb91ef108750b5d103e2d55bbf1f22965bb46a2ba3b35487b292
  variables:
    RPM_MANIFEST: qualification/core21-leap-aarch64.json
  before_script:
    - zypper --non-interactive install --no-recommends python3 ca-certificates shadow util-linux findutils

rpm-el10-arm64:
  extends: .rpm-native-installed
  rules:
    - if: '$RPM_NATIVE_QUALIFICATION == "core21" && ($RPM_NATIVE_TARGET == null || $RPM_NATIVE_TARGET == "el10")'
  image: almalinux@sha256:957738702313e6ee452cdb17bc1431542c467be9a4e2f4da3b8e551b0ebb9677
  variables:
    RPM_MANIFEST: qualification/core21-el10-aarch64.json
  before_script:
    - dnf -y --setopt=install_weak_deps=False install python3 ca-certificates shadow-utils util-linux findutils dnf-plugins-core epel-release
    - dnf config-manager --set-enabled crb

# Repository discovery and dependency solving use the same pinned core21 inputs.
# These jobs are opt-in; each creates and destroys its own metadata signing key.
rpm-repository-fedora-arm64:
  extends: rpm-fedora-arm64
  rules:
    - if: '$RPM_NATIVE_QUALIFICATION == "core21-solver" && ($RPM_NATIVE_TARGET == null || $RPM_NATIVE_TARGET == "fedora")'
  before_script:
    - dnf -y --setopt=install_weak_deps=False install python3 ca-certificates shadow-utils util-linux findutils createrepo_c gnupg2
  script:
    - python3 -B -W error tools/qualify-installed.py "$RPM_MANIFEST" --repository-install --output results/native-installed

rpm-repository-leap-arm64:
  extends: rpm-leap-arm64
  rules:
    - if: '$RPM_NATIVE_QUALIFICATION == "core21-solver" && ($RPM_NATIVE_TARGET == null || $RPM_NATIVE_TARGET == "leap")'
  before_script:
    - sed -i --follow-symlinks 's|http://cdn\.opensuse\.org/|https://cdn.opensuse.org/|g' /etc/zypp/repos.d/*.repo /usr/share/zypp/local/service/openSUSE/repo/repoindex.xml
    - zypper --non-interactive install --no-recommends python3 ca-certificates shadow util-linux findutils createrepo_c gpg2
  script:
    - python3 -B -W error tools/qualify-installed.py "$RPM_MANIFEST" --repository-install --output results/native-installed

rpm-repository-el10-arm64:
  extends: rpm-el10-arm64
  rules:
    - if: '$RPM_NATIVE_QUALIFICATION == "core21-solver" && ($RPM_NATIVE_TARGET == null || $RPM_NATIVE_TARGET == "el10")'
  before_script:
    - dnf -y --setopt=install_weak_deps=False install python3 ca-certificates shadow-utils util-linux findutils createrepo_c gnupg2 dnf-plugins-core epel-release
    - dnf config-manager --set-enabled crb
  script:
    - python3 -B -W error tools/qualify-installed.py "$RPM_MANIFEST" --repository-install --output results/native-installed

